<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1480" viewBox="0 0 1380 1480"><title>MediBed Pune system architecture</title><desc>Patients and hospital admins use the browser. Render HTTPS and Gunicorn serve a Flask monolith with secure routes, services and a managed PostgreSQL database. Local development uses SQLite.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#6E8998"/></marker></defs><rect width="1380" height="1480" fill="#FFFFFF"/><text x="48" y="77" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" fill="#133743">MediBed Pune | System architecture</text><text x="48" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#5D7180">Current Render deployment | Python modular monolith | PostgreSQL</text><rect x="48" y="155" width="622" height="100" rx="12" fill="#E8F5F1" stroke="#D9E3E8"/><text x="72" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Patients</text><text x="72" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Register, search hospitals, track requests</text><rect x="710" y="155" width="622" height="100" rx="12" fill="#E8F0FA" stroke="#D9E3E8"/><text x="734" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Hospital workspace administrators</text><text x="734" y="235" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Sign in, manage inventory, approve or reject</text><line x1="359" y1="255" x2="359" y2="286" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><line x1="1021" y1="255" x2="1021" y2="286" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="288" width="1284" height="110" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="72" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Browser interface</text><text x="72" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Jinja HTML + Bootstrap + vanilla JavaScript + Chart.js | JSON API polling every 5 seconds</text><line x1="690" y1="398" x2="690" y2="443" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="445" width="1284" height="634" rx="12" fill="#EDF4F7" stroke="#B9D1DA"/><text x="76" y="482" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#426576">RENDER WEB SERVICE</text><rect x="80" y="505" width="1220" height="92" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="104" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">HTTPS edge -&gt; Gunicorn WSGI server</text><text x="104" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Public onrender.com URL | 1 worker, 4 threads | app factory: wsgi:application</text><line x1="690" y1="597" x2="690" y2="629" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="631" width="1220" height="90" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="104" y="674" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Flask request security</text><text x="104" y="711" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Session cookies, CSRF, origin checks, role / hospital scope, request throttling</text><line x1="690" y1="721" x2="690" y2="756" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="758" width="380" height="124" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="104" y="801" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Public + authentication</text><text x="104" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Directory, contacts, registration</text><text x="104" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Patient / hospital admin sign-in</text><rect x="500" y="758" width="380" height="124" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="524" y="801" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Patient + admin routes</text><text x="524" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Requests, inventory, notifications</text><text x="524" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Hospital-scoped decisions</text><rect x="920" y="758" width="380" height="124" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="944" y="801" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Forecast routes</text><text x="944" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Recorded history, charts</text><text x="944" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Optional ML / moving average</text><line x1="270" y1="882" x2="270" y2="908" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="882" x2="690" y2="908" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><line x1="1110" y1="882" x2="1110" y2="908" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="910" width="1220" height="129" rx="12" fill="#FFFFFF" stroke="#D9E3E8"/><text x="104" y="953" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Domain services</text><text x="104" y="990" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Transactional bed reservation, approval / rejection, cancellation, waiting lists</text><text x="104" y="1019" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Inventory history, notifications, audit events, password hashing, forecast calculation</text><line x1="480" y1="1039" x2="480" y2="1120" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><text x="505" y="1102" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Flask-SQLAlchemy ORM</text><rect x="48" y="1123" width="850" height="162" rx="12" fill="#E8F5F1" stroke="#D9E3E8"/><text x="72" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Managed PostgreSQL | durable application state</text><text x="72" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Users, hospitals, beds, admission requests, notifications</text><text x="72" y="1232" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Ambulance reports, bed history, rate buckets, audit events</text><text x="72" y="1261" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Foreign keys, constraints, one active reservation per bed</text><rect x="938" y="1123" width="394" height="162" rx="12" fill="#FFF6E8" stroke="#D9E3E8"/><text x="962" y="1166" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#173C48">Checked-in source data</text><text x="962" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">6 Pune hospital listings</text><text x="962" y="1232" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">5 published dispatch contacts</text><text x="962" y="1261" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526776">Labeled synthetic evaluation data</text><line x1="938" y1="1205" x2="903" y2="1205" stroke="#6E8998" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="1320" width="1284" height="124" rx="12" fill="#F5F7FA" stroke="#D9E3E8"/><text x="72" y="1360" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#233849">Local development: Flask + SQLite. Hosted Render access does not require the laptop.</text><text x="72" y="1396" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526776">Calls: tel: links open the device dialer. No dispatch, GPS or hospital inventory feed is connected.</text><text x="72" y="1428" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526776">Workspace decisions and synthetic inventory are for evaluation; they are not hospital confirmations.</text></svg>